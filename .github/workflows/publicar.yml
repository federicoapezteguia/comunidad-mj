# Publica el sitio en el hosting cada vez que se sube un cambio (por ejemplo, una nota nueva).
#
# Configuración (una sola vez), en GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: SITE_URL     (ej. https://prueba.tudominio.com.ar)
#              STAGING      (true mientras sea el subdominio de prueba; false al migrar)
#              FTP_DIR      (carpeta destino en el hosting, ej. /  o  /public_html/)
#              FTP_PROTOCOL (ftps o ftp; por defecto ftps)

name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Reconstruye cada hora: publica las notas programadas a futuro
    # y actualiza el sitemap de Google News (últimas 48 h).
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Descargar fotos nuevas (Wikimedia Commons)
        run: |
          node scripts/descargar-fotos.mjs
          if [ -n "$(git status --porcelain src/content/notas/img)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/notas/img
            git commit -m "Fotos descargadas automáticamente [skip ci]"
            git push
          fi

      - name: Generar el sitio
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          STAGING: ${{ vars.STAGING }}

      - name: Subir al hosting por FTP
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
