name: post-migracion
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Redirigir el subdominio de prueba
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ vars.FTP_DIR }}
        run: |
          printf '%s\n' 'Options -Indexes' '<IfModule mod_rewrite.c>' '  RewriteEngine On' '  RewriteRule ^ https://www.comunidadfanmj.com.ar%{REQUEST_URI} [L,R=301]' '</IfModule>' > htaccess-redireccion
          lftp -u "$U","$P" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; cd $D; mv .htaccess .htaccess-prueba-bak; put htaccess-redireccion -o .htaccess; bye" "$S" && echo "R redireccion subida"
      - name: Verificar
        run: |
          B=https://www.comunidadfanmj.com.ar
          echo "R meta: $(curl -s $B/ | grep -oE '<meta name="robots"[^>]*>|<link rel="canonical"[^>]*>|<meta property="og:url"[^>]*>' | tr '\n' ' ')"
          echo "R robots: $(curl -s $B/robots.txt | tr '\n' '|')"
          echo "R sitemap: $(curl -s -o /dev/null -w '%{http_code}' $B/sitemap-index.xml) urls=$(curl -s $B/sitemap-0.xml | grep -o '<loc>' | wc -l) primera=$(curl -s $B/sitemap-0.xml | grep -oE '<loc>[^<]*' | head -1)"
          echo "R apex: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://comunidadfanmj.com.ar/marcos-juarez/)"
          echo "R prueba: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://comunidad.rokmarketing.com/deportes/basquet-argentino-le-gano-a-adeo-cuartos-de-final/)"
          echo "R nota: $(curl -s -o /dev/null -w '%{http_code}' $B/deportes/basquet-argentino-le-gano-a-adeo-cuartos-de-final/)"
          echo "R encuesta: $(curl -s $B/api/encuesta.php | head -c 200)"
          echo "R visitas: $(curl -s $B/api/visitas.php | head -c 200)"
          echo "R notas.json: $(curl -s -o /dev/null -w '%{http_code}' $B/api/notas.json)"
          echo "R admin: $(curl -s -o /dev/null -w '%{http_code}' $B/api/admin.php)"
          echo "R config bloqueado: $(curl -s -o /dev/null -w '%{http_code}' $B/api/config.php)"
          echo "R buscador: $(curl -s -o /dev/null -w '%{http_code}' $B/pagefind/pagefind.js)"
          echo "R 404: $(curl -s -o /dev/null -w '%{http_code}' $B/no-existe/)"
