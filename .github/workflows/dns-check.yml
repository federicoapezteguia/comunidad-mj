name: dns-check
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ns in dns1.raiolanetworks.es dns2.raiolanetworks.es dns3.raiolanetworks.es; do
            echo "R $ns ($(dig +short A $ns | head -1)): $(dig comunidadfanmj.com.ar SOA @$ns | grep -oE 'status: [A-Z]+'), flags: $(dig comunidadfanmj.com.ar SOA @$ns | grep -oE 'flags: [a-z ]+')"
          done
          echo "R rokmarketing NS: $(dig +short NS rokmarketing.com @8.8.8.8 | tr '\n' ' ')"
          echo "R ptr 178.211.133.102: $(dig +short -x 178.211.133.102)"
