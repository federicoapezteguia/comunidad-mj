name: dns-check
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in comunidadfanmj.com.ar www.comunidadfanmj.com.ar; do echo "A $d: $(dig +short A $d @8.8.8.8 | tr '\n' ' ')"; done
          for u in http://comunidadfanmj.com.ar/ https://comunidadfanmj.com.ar/ https://www.comunidadfanmj.com.ar/; do
            echo "--- $u"; curl -sSI --max-time 20 "$u" 2>&1 | grep -iE '^(HTTP|location|server)|curl' ; done
          echo "--- robots"; curl -s --max-time 20 https://www.comunidadfanmj.com.ar/robots.txt | head -8
          echo "--- meta"; curl -s --max-time 20 https://www.comunidadfanmj.com.ar/ | grep -oE '<meta name="robots"[^>]*>|<link rel="canonical"[^>]*>|<meta property="og:url"[^>]*>' | head
          echo "--- sitemap $(curl -s -o /dev/null -w '%{http_code}' https://www.comunidadfanmj.com.ar/sitemap-index.xml)"
          echo "--- encuesta $(curl -s --max-time 20 'https://www.comunidadfanmj.com.ar/api/encuesta.php' | head -c 200)"
          echo "--- visitas $(curl -s --max-time 20 'https://www.comunidadfanmj.com.ar/api/visitas.php' | head -c 200)"
          echo "--- cert"; echo | openssl s_client -connect www.comunidadfanmj.com.ar:443 -servername www.comunidadfanmj.com.ar 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null
          echo "--- staging"; curl -sSI --max-time 20 https://comunidad.rokmarketing.com/ | grep -iE '^(HTTP|location)'
